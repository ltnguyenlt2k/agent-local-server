# local-ai-gateway — LiteLLM + PostgreSQL + Cloudflare Tunnel.
#
# Ollama is intentionally NOT a service here — it runs natively on
# machine B, outside Docker Compose. See docs/ollama-windows.md /
# docs/ollama-wsl.md.
#
# Network segmentation (docs/network-security.md has the full rationale):
#   ai_frontend  — cloudflared <-> litellm
#   ai_backend   — litellm <-> postgres, internal-only (no route out)
# So cloudflared (the only service reachable from the Internet, via the
# tunnel) has no network path to Postgres even at the Docker network
# layer, on top of never publishing 5432.

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  litellm:
    image: ${LITELLM_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      # Mounts the RENDERED config, not the template. Run
      # scripts/render-config.sh (or bootstrap.sh/preflight.sh, which
      # call it automatically) before `docker compose up`.
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    ports:
      # Loopback-only: reduces the odds of port 4000 being reachable
      # from the LAN by accident. cloudflared still reaches this
      # service over the ai_frontend network as http://litellm:4000,
      # not via this published port.
      - "127.0.0.1:${LITELLM_PORT}:4000"
    networks:
      - ai_frontend
      - ai_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # VERIFY before relying on this: /health/readiness must exist on
      # the pinned LITELLM_IMAGE version (docs §22/§61). If it doesn't,
      # swap for another endpoint the pinned release actually exposes —
      # never leave a healthcheck that always passes.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness')"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    # Locally-managed (config-file) tunnel — see
    # cloudflared/config.yml.template for why this is the default
    # instead of --token mode: it avoids the Cloudflare Zero Trust
    # dashboard's "Activate Zero Trust" payment-method gate, which
    # --token mode's Public Hostname configuration requires going
    # through. Both ${CLOUDFLARE_TUNNEL_ID}'s config and the mounted
    # credentials file are rendered/copied by scripts/cloudflare-setup.sh.
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/tunnel-credentials.json:/etc/cloudflared/tunnel-credentials.json:ro
    networks:
      - ai_frontend
    healthcheck:
      # Verified against the pinned cloudflared 2026.8.2 binary directly
      # (not guessed): `cloudflared tunnel ready` FAILS with "--metrics
      # has to be provided" if the flag is omitted, and the flag must go
      # BEFORE the `ready` subcommand (`tunnel --metrics <addr> ready`),
      # not after — `ready`'s own subcommand options don't accept it.
      # The address must match the --metrics bind address in `command`
      # above. Confirmed working end-to-end against a real running
      # tunnel (exit 0 once connected, non-zero before/without a live
      # edge connection).
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

networks:
  ai_frontend:
    driver: bridge
  ai_backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
